<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>헌옷 리사이클링 - 생활용품 만들기</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Prettified Korean font (Pretendard / Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', '"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f2fbf5',
              100: '#e1f6e9',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 부드러운 배경 그라데이션 및 애니메이션 효과 */
    .hero-glow {
      background: radial-gradient(circle at 50% 35%, rgba(52, 211, 153, 0.22) 0%, rgba(243, 244, 246, 0) 70%);
    }
    .modal-enter {
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(8px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen flex flex-col justify-between selection:bg-emerald-100 selection:text-emerald-900">

  <!-- 상단 미니 네비게이션 / 뱃지 -->
  <header class="w-full pt-8 px-6 flex justify-center">
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-50 border border-emerald-200/80 text-emerald-800 text-xs sm:text-sm font-medium shadow-xs">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      친환경 제로웨이스트 업사이클링
    </div>
  </header>

  <!-- 메인 히어로 섹션 (화면 중앙 정렬) -->
  <main class="w-full max-w-md mx-auto px-6 py-12 flex-1 flex flex-col items-center justify-center text-center hero-glow">
    
    <!-- 비주얼 그래픽 아이콘 (천/바늘/새싹 상징 SVG) -->
    <div class="w-20 h-20 mb-6 sm:w-24 sm:h-24 rounded-3xl bg-white shadow-xl shadow-emerald-500/10 border border-emerald-100 flex items-center justify-center text-emerald-600 transition-transform hover:scale-105 duration-300">
      <svg class="w-10 h-10 sm:w-12 sm:h-12" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <!-- 티셔츠 & 리사이클 아이콘 조합 -->
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 14.25l6-6m0 0l-3-3m3 3H3.75a6.75 6.75 0 000 13.5h16.5a6.75 6.75 0 000-13.5h-1.5" />
      </svg>
    </div>

    <!-- 앱 제목 -->
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-stone-900 leading-snug mb-3">
      헌옷으로 만드는<br>
      <span class="text-emerald-600">나만의 생활용품</span>
    </h1>

    <!-- 한 줄 설명 -->
    <p class="text-sm sm:text-base text-stone-600 font-normal leading-relaxed mb-8 max-w-xs">
      입지 않는 옷을 버리지 마세요. 일상 속 실용적인 소품과 생활용품으로 다시 태어납니다.
    </p>

    <!-- [시작] 버튼 -->
    <div class="w-full max-w-xs">
      <button 
        id="startBtn"
        type="button" 
        class="w-full py-4 px-6 rounded-2xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold text-base shadow-lg shadow-emerald-600/25 transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer focus:outline-none focus:ring-4 focus:ring-emerald-500/20">
        <span>시작하기</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
        </svg>
      </button>
    </div>
  </main>

  <!-- 하단 푸터 카피라이트 -->
  <footer class="w-full py-6 text-center text-xs text-stone-400">
    © 헌옷 업사이클링 프로젝트. All rights reserved.
  </footer>

  <!-- 알림 팝업 모달 (준비 중 안내) -->
  <div id="alertModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/40 backdrop-blur-xs hidden transition-opacity" role="dialog" aria-modal="true">
    <div class="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl border border-stone-100 modal-enter text-center">
      <!-- 팝업 아이콘 -->
      <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-amber-50 text-amber-500 flex items-center justify-center text-xl">
        🚧
      </div>
      
      <!-- 제목 및 본문 -->
      <h3 class="text-lg font-bold text-stone-900 mb-1">서비스 준비 중</h3>
      <p class="text-xs text-stone-500 mb-5 leading-relaxed">
        현재 업사이클링 가이드 콘텐츠를 열심히 제작하고 있어요! 곧 찾아뵙겠습니다.
      </p>

      <!-- 닫기 버튼 -->
      <button 
        id="closeModalBtn"
        type="button" 
        class="w-full py-2.5 px-4 rounded-xl bg-stone-100 hover:bg-stone-200 active:bg-stone-300 text-stone-800 text-sm font-semibold transition-colors cursor-pointer">
        확인
      </button>
    </div>
  </div>

  <!-- 인라인 자바스크립트 -->
  <script>
    const startBtn = document.getElementById('startBtn');
    const alertModal = document.getElementById('alertModal');
    const closeModalBtn = document.getElementById('closeModalBtn');

    // 모달 열기 함수
    function openModal() {
      alertModal.classList.remove('hidden');
    }

    // 모달 닫기 함수
    function closeModal() {
      alertModal.classList.add('hidden');
    }

    // 이벤트 리스너 등록
    startBtn.addEventListener('click', openModal);
    closeModalBtn.addEventListener('click', closeModal);

    // 모달 바깥 배경 클릭 시 닫기
    alertModal.addEventListener('click', (event) => {
      if (event.target === alertModal) {
        closeModal();
      }
    });

    // ESC 키 입력 시 모달 닫기
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !alertModal.classList.contains('hidden')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
